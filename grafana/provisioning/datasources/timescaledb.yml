apiVersion: 1
datasources:
  - name: TimescaleDB
    uid: oee-timescaledb
    type: grafana-postgresql-datasource
    access: proxy
    url: timescaledb:5432
    user: grafana_reader
    isDefault: true
    editable: false
    jsonData:
      database: ${OEE_DB_NAME}
      sslmode: require
      postgresVersion: 1600
      timescaledb: true
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
