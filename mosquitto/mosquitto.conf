# Eclipse Mosquitto 2.x – industrial-oee-platform
per_listener_settings false
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

# --- Persistence & 24/7 queue limits -----------------------------------------
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
max_queued_messages 50000
max_inflight_messages 200
persistent_client_expiration 7d
message_size_limit 262144

# --- Logging (container log rotation handles retention) ----------------------
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# --- Internal listener (oee_net only, NOT published) -------------------------
listener 1883 0.0.0.0
protocol mqtt

# --- TLS listener for field devices / gateways (published) -------------------
listener 8883 0.0.0.0
protocol mqtt
certfile /mosquitto/data/certs/server.crt
keyfile /mosquitto/data/certs/server.key
cafile /mosquitto/data/certs/ca.crt
tls_version tlsv1.2
