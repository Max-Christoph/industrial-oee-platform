[project]
name = "ingest-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "oee-shared",
    "aiomqtt>=2.3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_worker"]

[tool.uv.sources]
oee-shared = { workspace = true }
